name: Publish Images

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.0.2). If empty, uses the VERSION file.'
        required: false
        type: string
      target:
        description: 'Bake target to publish'
        required: false
        default: 'core'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anticlimaxtic/cde

jobs:
  publish:
    name: Publish ${{ github.event.inputs.target || 'core' }}
    runs-on: ubuntu-latest
    # Only run on actual releases or manual dispatch with intent to publish
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          TARGET="${{ github.event.inputs.target || 'core' }}"
          echo "target=${TARGET}" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            # Release Please creates tags like "core-0.0.2", "android-0.0.1", "cpp-clang-0.0.1", "android-cpp-0.0.1" etc.
            TAG="${{ github.event.release.tag_name }}"
            # Extract component (handles components with dashes like "android-cpp")
            COMPONENT=${TAG%%-[0-9]*}
            VERSION=${TAG#${COMPONENT}-}
            TARGET=${COMPONENT}
            echo "target=${TARGET}" >> $GITHUB_OUTPUT
          else
            VERSION=$(cat images/${TARGET}/VERSION | tr -d '[:space:]')
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Using version: ${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute Docker tags (immutable + shadowing)
        id: tags
        shell: bash
        run: |
          TARGET="${{ steps.version.outputs.target }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(git rev-parse --short HEAD)
          REG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Comma-separated for docker/bake-action set (single value)
          TAGS_CSV="${REG}:${TARGET}-${VERSION}-${SHA},${REG}:${TARGET}-${VERSION},${REG}:${TARGET}-$(echo ${VERSION} | cut -d. -f1,2),${REG}:${TARGET}-$(echo ${VERSION} | cut -d. -f1),${REG}:${TARGET}"
          echo "tags=${TAGS_CSV}" >> $GITHUB_OUTPUT

          # Multi-line for summary display
          {
            echo "tags_block<<EOF"
            echo "${REG}:${TARGET}-${VERSION}-${SHA}"
            echo "${REG}:${TARGET}-${VERSION}"
            echo "${REG}:${TARGET}-$(echo ${VERSION} | cut -d. -f1,2)"
            echo "${REG}:${TARGET}-$(echo ${VERSION} | cut -d. -f1)"
            echo "${REG}:${TARGET}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Full tag list:"
          echo "${REG}:${TARGET}-${VERSION}-${SHA}"
          echo "${REG}:${TARGET}-${VERSION}"
          echo "${REG}:${TARGET}-$(echo ${VERSION} | cut -d. -f1,2)"
          echo "${REG}:${TARGET}-$(echo ${VERSION} | cut -d. -f1)"
          echo "${REG}:${TARGET}"

      - name: Publish with Bake
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-bake.hcl
          targets: ${{ steps.version.outputs.target }}
          push: true
          set: |
            ${{ steps.version.outputs.target }}.tags=${{ steps.tags.outputs.tags }}
            ${{ steps.version.outputs.target }}.platforms=linux/amd64,linux/arm64
            ${{ steps.version.outputs.target }}.labels.org.opencontainers.image.version=${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.target }}.labels.org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        shell: bash
        run: |
          TARGET="${{ steps.version.outputs.target }}"
          echo "## ✅ Published ${TARGET}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.tags.outputs.tags_block }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Immutable tag: \`${TARGET}-${{ steps.version.outputs.version }}-<short-sha>\`" >> $GITHUB_STEP_SUMMARY
          echo "Moving tags updated: \`${TARGET}-${{ steps.version.outputs.version }}\`, major/minor variants, and \`${TARGET}\`" >> $GITHUB_STEP_SUMMARY
