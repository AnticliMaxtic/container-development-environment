name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          # These secrets come from a GitHub App (created via UI or Terraform) and installed on the repo/org.
          # You are using RELEASE_PLEASE_APP_ID and RELEASE_PLEASE_PRIVATE_KEY.
          # See AGENTS.md "Release Please permissions note" for setup details.
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

      - name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.generate-token.outputs.token }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json
