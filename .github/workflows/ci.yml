name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic version override (e.g. 0.1.0). Leave empty to use VERSION file.'
        required: false
        type: string
      push:
        description: 'Push images to registry (manual testing only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      target:
        description: 'Bake target to build'
        required: false
        default: 'core'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: anticlimaxtic/cde

jobs:
  build:
    name: Build ${{ github.event.inputs.target || 'core' }}${{ github.event_name == 'pull_request' && ' (auto-selected by edited paths)' || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU (for multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine target from changes (PR) or input (dispatch)
        id: target
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Auto-select target based on what was edited in the PR for focused validation
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            CHANGED_FILES=$(git diff --name-only $BASE_SHA...HEAD || true)

            if echo "$CHANGED_FILES" | grep -qE '^images/android-cpp/'; then
              TARGET="android-cpp"
            elif echo "$CHANGED_FILES" | grep -qE '^images/android/'; then
              TARGET="android"
            elif echo "$CHANGED_FILES" | grep -qE '^images/cpp-clang/'; then
              TARGET="cpp-clang"
            elif echo "$CHANGED_FILES" | grep -qE '^images/cpp-gcc/'; then
              TARGET="cpp-gcc"
            elif echo "$CHANGED_FILES" | grep -qE '^images/cpp/'; then
              TARGET="cpp"
            elif echo "$CHANGED_FILES" | grep -qE '^images/core/'; then
              TARGET="core"
            else
              # Fallback for changes outside images/ (e.g. workflows, docs) or mixed
              TARGET="core"
            fi
            echo "Detected changed paths; selected target: $TARGET"
          else
            TARGET="${{ github.event.inputs.target || 'core' }}"
          fi
          echo "target=$TARGET" >> $GITHUB_OUTPUT

      - name: Determine version and tags
        id: meta
        shell: bash
        run: |
          # Use the target determined above (path-based for PRs, input for dispatch)
          TARGET="${{ steps.target.outputs.target }}"
          echo "target=${TARGET}" >> $GITHUB_OUTPUT

          # Determine the base semver from the target's VERSION file
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=$(cat images/${TARGET}/VERSION | tr -d '[:space:]')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

          # Short commit SHA (always from the actual commit)
          SHA=$(git rev-parse --short HEAD)
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

          # Full immutable tag (always includes sha)
          IMMUTABLE_TAG="${TARGET}-${VERSION}-${SHA}"

          # Calculate shadowing (moving) tags
          # e.g. android-0.0.1, android-0.0, android-0, android
          MAJOR=$(echo "${VERSION}" | cut -d. -f1)
          MINOR=$(echo "${VERSION}" | cut -d. -f1-2)

          REG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"

          # Comma-separated for docker/bake-action set: (single-line value required)
          TAGS_CSV="${REG}:${IMMUTABLE_TAG},${REG}:${TARGET}-${VERSION},${REG}:${TARGET}-${MINOR},${REG}:${TARGET}-${MAJOR},${REG}:${TARGET}"
          echo "tags=${TAGS_CSV}" >> $GITHUB_OUTPUT

          # Multi-line block for the job summary display only
          {
            echo "tags_block<<EOF"
            echo "${REG}:${IMMUTABLE_TAG}"
            echo "${REG}:${TARGET}-${VERSION}"
            echo "${REG}:${TARGET}-${MINOR}"
            echo "${REG}:${TARGET}-${MAJOR}"
            echo "${REG}:${TARGET}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

          echo "Immutable tag: ${IMMUTABLE_TAG}"
          echo "Moving tags will point to: ${TARGET}-${VERSION}, ${TARGET}-${MINOR}, ${TARGET}-${MAJOR}, ${TARGET}"

      - name: Determine build platforms
        id: platforms
        shell: bash
        run: |
          # Validation and manual dry-runs always use single-arch for fast feedback
          # (Docker cannot `load` multi-platform images).
          # Real publishes (via the publish.yml workflow) use multi-arch.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PLATFORMS="linux/amd64"
            echo "mode=validation (single-arch for load)" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push }}" = "true" ]; then
            PLATFORMS="linux/amd64,linux/arm64"
            echo "mode=manual multi-arch push (testing only)" >> $GITHUB_OUTPUT
          else
            PLATFORMS="linux/amd64"
            echo "mode=manual dry-run (single-arch)" >> $GITHUB_OUTPUT
          fi

          echo "platforms=${PLATFORMS}" >> $GITHUB_OUTPUT
          echo "Selected platforms: ${PLATFORMS}"

      - name: Log in to GitHub Container Registry
        # Only login when manually requesting a push (for testing)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute bake push/load settings
        id: bake-settings
        shell: bash
        run: |
          TARGET="${{ steps.target.outputs.target }}"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR validation: build only, no push
            echo "push=false" >> $GITHUB_OUTPUT
            echo "load=true" >> $GITHUB_OUTPUT
            echo "action=Building (validation only - no push)"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push }}" = "true" ]; then
            echo "push=true" >> $GITHUB_OUTPUT
            echo "load=false" >> $GITHUB_OUTPUT
            echo "action=Building and pushing (manual test)"
          else
            echo "push=false" >> $GITHUB_OUTPUT
            echo "load=true" >> $GITHUB_OUTPUT
            echo "action=Building (manual dry-run)"
          fi

          echo "target=${TARGET}" >> $GITHUB_OUTPUT
          echo "arch_mode=${{ steps.platforms.outputs.mode }}" >> $GITHUB_OUTPUT

      - name: Build and push with Bake
        uses: docker/bake-action@v6
        with:
          files: |
            ./docker-bake.hcl
          targets: ${{ steps.bake-settings.outputs.target }}
          push: ${{ steps.bake-settings.outputs.push }}
          load: ${{ steps.bake-settings.outputs.load }}
          set: |
            ${{ steps.bake-settings.outputs.target }}.tags=${{ steps.meta.outputs.tags }}
            ${{ steps.bake-settings.outputs.target }}.platforms=${{ steps.platforms.outputs.platforms }}
            ${{ steps.bake-settings.outputs.target }}.labels.org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            ${{ steps.bake-settings.outputs.target }}.labels.org.opencontainers.image.revision=${{ github.sha }}

      - name: Summary
        shell: bash
        run: |
          echo "## ${{ steps.bake-settings.outputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** \`${{ steps.bake-settings.outputs.target }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Architectures:** \`${{ steps.platforms.outputs.platforms }}\` (${{ steps.bake-settings.outputs.arch_mode }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags_block }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          TARGET="${{ steps.bake-settings.outputs.target }}"
          if [ "${{ steps.bake-settings.outputs.push }}" = "true" ]; then
            echo "✅ Images pushed to **${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The following tags were updated:" >> $GITHUB_STEP_SUMMARY
            echo "- \`${TARGET}-${{ steps.meta.outputs.version }}\` (and major/minor variants)" >> $GITHUB_STEP_SUMMARY
            echo "- \`${TARGET}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Immutable tag (never moves): \`${TARGET}-${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ Build completed. Nothing pushed (validation or manual dry-run)." >> $GITHUB_STEP_SUMMARY
          fi
